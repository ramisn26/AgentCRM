server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # This is required for proxying to HTTPS domains (SNI)
  proxy_ssl_server_name on;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # SSE endpoint
  location = /api/events {
    resolver 127.0.0.11;
    set $events_backend https://forgecrm-backend.onrender.com/api/events;
    proxy_pass $events_backend;
    proxy_http_version 1.1;
    proxy_set_header Host forgecrm-backend.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding on;
  }

  location /api {
    resolver 127.0.0.11;
    set $api_backend https://forgecrm-backend.onrender.com;
    proxy_pass $api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host forgecrm-backend.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads {
    resolver 127.0.0.11;
    set $uploads_backend https://forgecrm-backend.onrender.com;
    proxy_pass $uploads_backend;
    proxy_http_version 1.1;
    proxy_set_header Host forgecrm-backend.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /l/ {
    resolver 127.0.0.11;
    set $l_backend https://forgecrm-backend.onrender.com;
    proxy_pass $l_backend;
    proxy_http_version 1.1;
    proxy_set_header Host forgecrm-backend.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
